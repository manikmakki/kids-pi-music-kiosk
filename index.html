<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Music time</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main>
  <header><div><p class="eyebrow">A LITTLE MUSIC, A LOT OF JOY</p><h1>Music time<span>♪</span></h1></div><span id="connection" role="status">Ready to listen</span></header>
  <section id="stations" aria-label="Choose a station"></section>
  <section class="player" aria-label="Music player"><div class="player-heading"><div><p class="eyebrow">YOUR STATION</p><h2 id="station-name">Kids Club</h2></div><button id="retry" class="quiet">↻ Try again</button></div><div id="frame-holder"></div><p id="message" role="status">Getting your music ready…</p></section>
  <footer><button id="play" class="play" disabled>▶ Play music</button><div class="volume" aria-label="Volume"><button id="quieter" aria-label="Quieter">−</button><div><span>VOLUME</span><strong id="volume">40%</strong></div><button id="louder" aria-label="Louder">+</button></div></footer>
</main></body></html>
